services:
  postgres:
    image: postgres:16-alpine
    container_name: earthquake_postgres
    environment:
      POSTGRES_DB: earthquake_db
      POSTGRES_USER: smart_user
      POSTGRES_PASSWORD: smart_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
